<section class="hero-banner">
  <img src="assets/images/hero-investigacion.svg" alt="Hero" class="hero-bg-image">
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1><i class="fas fa-chart-bar"></i> Investigacion en Cifras</h1>
    <p>Conoce los datos de las investigaciones de la Universidad de Cundinamarca</p>
  </div>
</section>

<section class="charts-section">
  <div class="charts-container">
    <div class="chart-card" *ngFor="let chart of charts">
      <div class="chart-header">
        <i class="fas fa-chart-pie"></i>
        <span>Datos de investigacion</span>
      </div>
      <div class="chart-body">
        <img [src]="chart.image" alt="Chart">
      </div>
    </div>
  </div>
</section>
