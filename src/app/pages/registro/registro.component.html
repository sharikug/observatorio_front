<section class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a routerLink="/home" class="brand-logo"><span class="brand-icon">O</span><span class="brand-text">Observatorio</span></a>
        <h1>Registro</h1>
      </div>
      <form (ngSubmit)="register()" class="auth-form">
        <div class="form-row">
          <div class="form-group"><label for="nombres">Nombres</label><input type="text" id="nombres" [(ngModel)]="user.nombres" name="nombres" placeholder="Tus nombres" required></div>
          <div class="form-group"><label for="apellidos">Apellidos</label><input type="text" id="apellidos" [(ngModel)]="user.apellidos" name="apellidos" placeholder="Tus apellidos" required></div>
        </div>
        <div class="form-group"><label for="email">Correo Electrónico</label><input type="email" id="email" [(ngModel)]="user.email" name="email" placeholder="tu&#64;email.com" required></div>
        <div class="form-row">
          <div class="form-group"><label for="telefono">Teléfono</label><input type="tel" id="telefono" [(ngModel)]="user.telefono" name="telefono" placeholder="+57 300 123 4567"></div>
          <div class="form-group"><label for="cargo">Cargo</label><input type="text" id="cargo" [(ngModel)]="user.cargo" name="cargo" placeholder="Tu cargo"></div>
        </div>
        <div class="form-group"><label for="password">Contraseña</label>
          <div class="password-input"><input [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="user.password" name="password" placeholder="••••••••" required><button type="button" class="toggle-password" (click)="togglePassword()">{{ showPassword ? 'Ver' : 'Ocultar' }}</button></div>
        </div>
        <div class="form-group"><label for="confirmPassword">Confirmación de Contraseña</label><input type="password" id="confirmPassword" [(ngModel)]="user.confirmPassword" name="confirmPassword" placeholder="••••••••" required></div>
        <div class="form-checkboxes">
          <label class="checkbox-label"><input type="checkbox" [(ngModel)]="user.acceptData" name="acceptData"><span>Acepto el tratamiento de datos personales</span></label>
          <label class="checkbox-label"><input type="checkbox" [(ngModel)]="user.acceptTerms" name="acceptTerms"><span>Acepto los <a routerLink="/terminos">términos y condiciones</a></span></label>
        </div>
        <button type="submit" class="btn-submit">Registrarse</button>
      </form>
      <div class="auth-footer"><p>Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a></p></div>
    </div>
  </div>
</section>
