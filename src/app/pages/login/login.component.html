<section class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a routerLink="/home" class="brand-logo"><span class="brand-icon">O</span><span class="brand-text">Observatorio</span></a>
        <h1>Inicio de Sesión</h1>
      </div>
      <form (ngSubmit)="login()" class="auth-form">
        <div class="form-group"><label for="email">Correo Electrónico</label><input type="email" id="email" [(ngModel)]="credentials.email" name="email" placeholder="tu&#64;email.com" required></div>
        <div class="form-group"><label for="password">Contraseña</label>
          <div class="password-input"><input [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="credentials.password" name="password" placeholder="••••••••" required><button type="button" class="toggle-password" (click)="togglePassword()">{{ showPassword ? 'Ver' : 'Ocultar' }}</button></div>
        </div>
        <div class="form-options">
          <label class="checkbox-label"><input type="checkbox" [(ngModel)]="credentials.rememberMe" name="rememberMe"><span>Recordarme</span></label>
          <a href="#" class="forgot-password">Restablecer contraseña</a>
        </div>
        <button type="submit" class="btn-submit">Ingresar</button>
      </form>
      <div class="auth-footer"><p>Aun no tienes cuenta? <a routerLink="/registro">Regístrate aquí</a></p></div>
    </div>
  </div>
</section>
