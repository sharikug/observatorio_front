<section class="hero-banner">
  <img src="assets/images/hero-login.svg" alt="Hero" class="hero-bg-image">
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1><i class="fas fa-sign-in-alt"></i> Inicio de Sesion</h1>
  </div>
</section>

<section class="login-section">
  <div class="login-container">
    <form (ngSubmit)="login()" class="login-form">
      <div class="form-group">
        <label><i class="fas fa-user"></i> Usuario</label>
        <input type="text" [(ngModel)]="credentials.usuario" name="usuario" placeholder="Tu usuario">
      </div>
      <div class="form-group">
        <label><i class="fas fa-lock"></i> Contrasena</label>
        <input type="password" [(ngModel)]="credentials.password" name="password" placeholder="Tu contrasena">
      </div>
      <div class="form-options">
        <label class="checkbox-label">
          <input type="checkbox" [(ngModel)]="credentials.rememberMe" name="rememberMe">
          <span><i class="fas fa-check-square"></i> Recordarme</span>
        </label>
        <a href="#" class="forgot"><i class="fas fa-key"></i> Restablecer contrasena</a>
      </div>
      <button type="submit" class="btn-submit"><i class="fas fa-arrow-right"></i> Ingresar</button>
    </form>
    <p class="register-link">Aun no tienes cuenta? <a routerLink="/registro"><i class="fas fa-user-plus"></i> Registrate aqui</a></p>
  </div>
</section>
