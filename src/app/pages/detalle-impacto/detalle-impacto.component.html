<section class="detail-section">
  <div class="detail-container">
    <a routerLink="/impacto" class="back-link"><i class="fas fa-arrow-left"></i> Volver</a>
    <div class="detail-grid">
      <div class="detail-main">
        <div class="detail-image">
          <img [src]="impactCase?.image" [alt]="impactCase?.title">
        </div>
        <h2><i class="fas fa-folder-open"></i> {{ impactCase?.title }}</h2>
        <p>{{ impactCase?.desc }}</p>
      </div>
      <div class="detail-sidebar">
        <div class="info-card">
          <h3><i class="fas fa-users"></i> Investigadores</h3>
          <div class="researcher" *ngFor="let r of impactCase?.researchers">
            <i class="fas fa-user-circle"></i> <strong>{{ r.name }}</strong> - {{ r.role }}
          </div>
          <h3><i class="fas fa-user-friends"></i> Co-investigadores</h3>
          <h3><i class="fas fa-file-pdf"></i> Documentos</h3>
          <h3><i class="fas fa-link"></i> Links de interes.</h3>
          <div *ngFor="let link of impactCase?.links">
            <a href="https://{{ link }}" target="_blank"><i class="fas fa-external-link-alt"></i> {{ link }}</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
