<section class="hero-banner">
  <img src="assets/images/hero-reportes.svg" alt="Hero" class="hero-bg-image">
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1>Generador de reportes</h1>
    <p>Obten un reporte personalizado de la informacion que requieras.</p>
  </div>
</section>

<section class="report-intro">
  <div class="report-intro-container">
    <p>Selecciona los filtros de busqueda para obtener informacion personalizada.</p>
    <p class="warning">recuerda registrarte para poder generar documentos</p>
  </div>
</section>

<section class="report-section">
  <div class="report-container">
    <div class="report-form-area">
      <form (ngSubmit)="generateReport()" class="report-form">
        <div class="form-row">
          <div class="form-group">
            <label>Periodo de la busqueda</label>
            <input type="text" [(ngModel)]="filters.periodo" name="periodo" placeholder="Todos">
          </div>
          <div class="form-group">
            <label>Tipo de informacion</label>
            <select [(ngModel)]="filters.tipo" name="tipo">
              <option>Todos</option>
              <option>Produccion cientifica</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Programa Academico</label>
            <input type="text" [(ngModel)]="filters.programa" name="programa" placeholder="Todos">
          </div>
          <div class="form-group">
            <label>Grupo de Investigacion</label>
            <input type="text" [(ngModel)]="filters.grupo" name="grupo" placeholder="Todos">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Facultad</label>
            <select [(ngModel)]="filters.facultad" name="facultad">
              <option>Todas</option>
            </select>
          </div>
          <div class="form-group">
            <label>Estado del Proyecto</label>
            <select [(ngModel)]="filters.estado" name="estado">
              <option>Todos</option>
              <option>Activo</option>
              <option>Finalizado</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Fecha Inicial</label>
            <input type="date" [(ngModel)]="filters.fechaIni" name="fechaIni">
          </div>
          <div class="form-group">
            <label>Fecha Final</label>
            <input type="date" [(ngModel)]="filters.fechaFin" name="fechaFin">
          </div>
        </div>
        <button type="submit" class="btn-generate">Generar</button>
      </form>
    </div>
    <div class="report-preview">
      <h3>Vista previa</h3>
      <div class="preview-placeholder">
        <div class="preview-doc">
          <div class="doc-icon"><i class="fas fa-file-alt"></i></div>
          <span>Documento de investigacion</span>
        </div>
      </div>
      <h4>Historico de archivos generados</h4>
    </div>
  </div>
</section>
